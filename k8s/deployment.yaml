apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-node-demo
  namespace: harness-node-demo
  labels:
    app: harness-node-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: harness-node-demo
  template:
    metadata:
      labels:
        app: harness-node-demo
    spec:
      containers:
        - name: harness-node-demo
          image: nginx:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
