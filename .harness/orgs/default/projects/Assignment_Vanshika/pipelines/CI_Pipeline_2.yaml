pipeline:
  name: CI_Pipeline_2
  identifier: CI_Pipeline_2
  projectIdentifier: Assignment_Vanshika
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: vanshikapahuja
        repoName: Test1
        build: <+input>
  stages:
    - stage:
        name: Build
        identifier: Build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Run_1
                  identifier: Run_1
                  spec:
                    connectorRef: account.harnessImage
                    image: node:20
                    shell: Sh
                    command: |-
                      # mkdir /harness/apps
                      # cd /harness/apps
                      # npx @angular/cli new my-angular-app
                      # cd my-angular-app && npm install
                      # npx ng build --configuration production
                      # cd ../.. && npm install && npm run zip
                      # ls -la
                      # mv build.zip build_${HARNESS_JOB_ID}.zip
                      # ls -la
                      # export artifact="build_*.zip"
                      mkdir /harness/apps
                      cd /harness/apps

                      npx @angular/cli new my-angular-app
                      cd my-angular-app
                      npm install
                      npx ng build --configuration production

                      cd ../..
                      zip -r build_${HARNESS_JOB_ID}.zip .

                      ls -la

                      echo "artifact=build_${HARNESS_JOB_ID}.zip" >> $HARNESS_OUTPUT_PATH
                    envVariables:
                      HARNESS_JOB_ID: <+pipeline.sequenceId>
                    outputVariables:
                      - name: artifact
                        type: String
                        value: artifact
    - stage:
        name: artifactory_push
        identifier: artifactory_push
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: ArtifactoryUpload
                  name: ArtifactoryUpload_1
                  identifier: ArtifactoryUpload_1
                  spec:
                    connectorRef: artifactoryconnector
                    target: angular-npm-npm/
                    sourcePath: <+pipeline.stages.Build.spec.execution.steps.Run_1.output.outputVariables.artifact>
