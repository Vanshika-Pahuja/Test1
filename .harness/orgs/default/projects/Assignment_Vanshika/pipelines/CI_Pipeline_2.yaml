pipeline:
  name: CI_Pipeline_2
  identifier: CI_Pipeline_2
  projectIdentifier: Assignment_Vanshika
  orgIdentifier: default
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: vanshikapahuja
        repoName: Test1
        build: <+input>
  stages:
    - stage:
        name: Build
        identifier: Build
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: true
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Run_1
                  identifier: Run_1
                  spec:
                    connectorRef: account.harnessImage
                    image: node:20
                    shell: Sh
                    command: |-
                      mkdir /harness/apps
                      cd /harness/apps
                      npx @angular/cli new my-angular-app
                      cd my-angular-app && npm install
                      npx ng build --configuration production
                      cd ../.. && npm install && npm run zip
                      ls -la
                      mv build.zip build_${HARNESS_JOB_ID}.zip
                      ls -la
                      export artifact="build_*.zip"
                    envVariables:
                      HARNESS_JOB_ID: <+pipeline.sequenceId>
                    outputVariables:
                      - name: artifact
                        type: String
                        value: artifact
